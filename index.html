<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saku · Kelola uang dengan lebih sadar</title>
<link rel="icon" href="saku.jpg">
<link rel="apple-touch-icon" href="saku.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  const savedTheme = localStorage.getItem('saku_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body>
<div id="app"></div>

<!-- Library Eksternal -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Logic Utama (Urutan wajib: ui.js dulu, baru app.js) -->
<script src="ui.js"></script>
<script src="app.js"></script>
<script>
  const sunSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const moonSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function attachThemeToggle() {
    const navRight = document.querySelector('.navbar-right');
    if (navRight && !document.getElementById('btn-theme-toggle')) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'btn-theme-toggle';
      btn.className = 'theme-toggle-btn';
      btn.title = 'Ganti Mode Terang / Gelap';
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? sunSvg : moonSvg;
      btn.onclick = () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('saku_theme', next);
        btn.innerHTML = next === 'dark' ? sunSvg : moonSvg;
      };
      navRight.insertBefore(btn, navRight.firstChild);
    }
  }
  new MutationObserver(attachThemeToggle).observe(document.getElementById('app'), { childList: true, subtree: true });
</script>
</body>
</html>
